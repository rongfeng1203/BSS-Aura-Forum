<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Dashboard</title>
    <style>
        /* DARK THEME VARIABLES */
        :root {
            --bg-main: #181717;
            --sidebar-bg: #181717;
            --accent: #ffffff;
            --text-main: #454545;
            --text-muted: #ffffff;
            --card-shadow: 0 4px 6px -1px rgba(170, 170, 170, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* GLOBAL STYLES */
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: var(--bg-main); 
            margin: 0; 
            display: flex; 
            height: 100vh; 
        }

        /* SIDEBAR */
        nav {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid #292929;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        nav h2 { font-size: 1.2rem; color: var(--accent); margin-bottom: 30px; }
        .nav-item { 
            padding: 12px; 
            border-radius: 8px; 
            color: var(--text-muted); 
            cursor: pointer; 
            margin-bottom: 5px;
            transition: 0.2s;
            text-decoration: none;
        }
        .nav-item:hover { background: #292929; }
        .nav-item.active { background: #5b0c10; color: var(--accent);}

        /* MAIN CONTENT */
        main { flex: 1; overflow-y: auto; padding: 40px; }
        .header-row { color: white; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        .input-card {
            background: rgb(19, 19, 19);
            padding: 24px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
        }

        input, textarea {
            width: 100%;
            background: black;
            border: 1px solid #464646;
            color: white;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            outline: none;
            resize: vertical;
        }

        .btn-primary {
            background: #5b0c10;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .post-card {
            background: rgb(44, 44, 44);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 16px;
            border: 1px solid transparent;
        }
        
        .post-header { display: flex; align-items: center; margin-bottom: 12px; color: white; }
        .post-time { font-size: 0.8rem; color: #aaa; margin-left: auto; }
        .post-body { color: #ccc; line-height: 1.5; white-space: pre-wrap; }
    </style>
</head>
<body>

    <nav>
        <h2>BSSAuraForum</h2>
        <a href="/" class="nav-item active">Home</a>
        <a href="/templates/chat.html" class="nav-item">Study AI</a>
        <a href="/templates/MyTeachersAura.html" class="nav-item">Dashboard</a>
        <a href="/templates/MyReview.html" class="nav-item">My Reviews</a>
        <a href="/templates/Review.html" class="nav-item">Kudos your Teacher</a>
    </nav>

    <main>
        <div class="header-row">
            <h1>Activity Feed</h1>
        </div>

        <div class="input-card">
            <textarea id="messageInput" placeholder="Share your thoughts..."></textarea>
            <button class="btn-primary" id="submitBtn">Post</button>
            <div id="statusMessage" style="color: white; font-size: 0.8rem; margin-top: 10px;"></div>
        </div>

        <div id="feed-container"></div>
    </main>

    <script>
        const messageInput = document.getElementById('messageInput');
        const submitBtn = document.getElementById('submitBtn');
        const feedContainer = document.getElementById('feed-container');

        // 1. Loading messages
        async function loadMessages() {
            try {
                const res = await fetch('/api/messages');
                const data = await res.json();
                
                if (!data || data.length === 0) {
                    feedContainer.innerHTML = '<p style="color:white;">No messages yet.</p>';
                    return;
                }

                feedContainer.innerHTML = data.map(msg => `
                    <div class="post-card">
                        <div class="post-header">
                            <strong>Anonymous</strong>
                            <span class="post-time">${msg.timestamp || 'Recent'}</span>
                        </div>
                        <div class="post-body">${msg.content}</div>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Error loading feed:", err);
            }
        }

        // 2. Sending messages
        async function postMessage() {
            const content = messageInput.value.trim();
            if (!content) return;

            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content }) 
                });

                if (response.ok) {
                    messageInput.value = '';
                    loadMessages(); 
                }
            } catch (err) {
                console.error("Error sending message:", err);
            } finally {
                submitBtn.disabled = false;
            }
        }

        submitBtn.addEventListener('click', postMessage);
        window.addEventListener('DOMContentLoaded', loadMessages);
    </script>
</body>
</html>
