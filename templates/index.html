<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Dashboard</title>
    <style>
        /* DARK THEME VARIABLES */
        :root {
            --bg-main: #181717;
            --sidebar-bg: #181717;
            --accent: #ffffff;
            --text-main: #454545;
            --text-muted: #ffffff;
            --card-shadow: 0 4px 6px -1px rgba(170, 170, 170, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* GLOBAL STYLES */
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: var(--bg-main); 
            margin: 0; 
            display: flex; 
            height: 100vh; 
        }
        

        /* SIDEBAR */
        nav {
            width: 260px;
            background: var(--sidebar-bg);
            border-right: 1px solid #292929;
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        /* NAV ITEMS */
        nav h2 { font-size: 1.2rem; color: var(--accent); margin-bottom: 30px; }
        .nav-item { 
            padding: 12px; 
            border-radius: 8px; 
            color: var(--text-muted); 
            cursor: pointer; 
            margin-bottom: 5px;
            transition: 0.2s;
            text-decoration: none;
        }
        .nav-item.active { background: #5b0c10; color: var(--accent);}

        /* MAIN CONTENT */
        main { flex: 1; overflow-y: auto; padding: 40px; }

        .header-row { color: white; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* THE INPUT CARD */
        .input-card {
            background: rgb(19, 19, 19);
            padding: 24px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            margin-bottom: 30px;
        }

        /* INPUT STYLES */
        input, textarea {
            width: 100%;
            background: black;
            border: 1px solid #464646;
            color: white;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            outline: none;
        }
        input:focus, textarea:focus { border-color: var(--accent); ring: 2px var(--accent); }

        /* BUTTON STYLES */
        .btn-primary {
            background: #5b0c10;
            color: rgb(255, 255, 255);
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

        /* FEED CARDS */
        .post-card {
            background: rgb(44, 44, 44);
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            margin-bottom: 16px;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .post-card:hover { border-color: var(--accent); }
        
        .post-header { display: flex; align-items: center; margin-bottom: 12px; }

        .post-time { font-size: 0.8rem; color: var(--text-muted); margin-left: auto; }
        .post-body { color: #ccc; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }

    </style>
</head>
<body>

    <nav>
        <h2>BSSAuraForum</h2>
        <a href="/templates/index.html" class="nav-item active">General Discussion</a>
        <a href="/templates/chat.html" class="nav-item">Study AI</a>
        <a href="/templates/MyTeachersAura.html" class="nav-item">Dashboard</a>
        <a href="/templates/MyReview.html" class="nav-item">My Reviews</a>
        <a href="/templates/Review.html" class="nav-item">Kudos your Teacher</a>
    </nav>

    <main>
        <div class="header-row">
            <h1>Activity Feed</h1>
        </div>

        <div class="input-card">
            <textarea id="messageInput" placeholder="Share your thoughts..."></textarea>
            <button class="btn-primary" id="submitBtn">Post</button>
            <div id="statusMessage" style="color: white; font-size: 0.8rem; margin-top: 10px;"></div>
        </div>

        <div id="feed-container">
            </div>
    </main>

    <script>
    const messageInput = document.getElementById('messageInput');
    const submitBtn = document.getElementById('submitBtn');
    const feedContainer = document.getElementById('feed-container');

    // Posting the message
    submitBtn.addEventListener('click', async () => {
    const content = messageInput.value.trim();
    if (!content) return;

    try {
        const response = await fetch('/api/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: content }) // Key must be "content"
        });

        if (response.ok) {
            messageInput.value = ''; // Clear input
            loadMessages(); // Refresh the list
        } else {
            alert("Server error: " + response.status);
        }
    } catch (err) {
        console.error("Transmission error:", err);
    }
    });

    // Loading the messages
    async function loadMessages() {
    const res = await fetch('/api/messages');
    const data = await res.json();
    feedContainer.innerHTML = data.map(msg => `
        <div class="post-card">
            <div class="post-header">
                <strong>Anonymous</strong>
                <span class="post-time">${msg.timestamp}</span>
            </div>
            <div class="post-body">${msg.content}</div>
        </div>
    `).join('');
    }

    loadMessages(); // Call on page load

        // Send message to Node.js server
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            try {
                const response = await fetch('/post_message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                if (response.ok) {
                    messageInput.value = '';
                    loadFeed(); // Refresh the list
                }
            } catch (err) {
                console.error("Error sending message:", err);
            }
        }

        function getTimeAgo(timestamp) {
            const postTime = new Date(timestamp);
            const now = new Date();
            const secondsAgo = Math.floor((now - postTime) / 1000);
            if (secondsAgo < 60) return `just now`;
            if (secondsAgo < 3600) return `${Math.floor(secondsAgo / 60)}m ago`;
            if (secondsAgo < 86400) return `${Math.floor(secondsAgo / 3600)}h ago`;
            return postTime.toLocaleDateString();
        }

        function createPostCard(text, time) {
            const card = document.createElement('div');
            card.className = 'post-card';
            card.innerHTML = `
                <div class="post-header">
                    <strong style="color: white;">Anonymous User</strong>
                    <span class="post-time">${getTimeAgo(time)}</span>
                </div>
                <div class="post-body">${text}</div>
            `;
            return card;
        }

        submitBtn.addEventListener('click', sendMessage);
        window.addEventListener('DOMContentLoaded', loadFeed);
    </script>
    <script src="{{ url_for('static', filename='js/forum.js') }}"></script>
</body>
</html>
